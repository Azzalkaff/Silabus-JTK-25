        :root {
            --primary: #0f172a;
            --secondary: #334155;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --teori-color: #d97706;
            --praktik-color: #059669;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 1px;
            background-color: #fafbfc;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 70px 70px; 
            background-attachment: fixed;
            color: #333;
        }
        
        /* Header Section */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 1rem;
            color: var(--text-muted);
        }

        /* Navigation Tabs */
        .nav-container {
            background-color: var(--card-bg);
            padding: 0.5rem 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            overflow-x: auto; 
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            min-width: max-content; 
            padding-bottom: 0.5rem; 
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #f1f5f9;
            color: var(--primary);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.2);
        }

        /* Content Area */
        main {
            flex: 1;
            padding: 2rem 1rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .semester-content {
            display: none; 
            animation: fadeIn 0.3s ease-in-out;
        }

        .semester-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Info Card Header */
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .info-header h2 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .sks-badge {
            background-color: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Table Styling */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Interactivity on table rows */
        tbody tr {
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        tbody tr:hover {
            background-color: #f1f5f9;
            transform: scale(1.002);
            box-shadow: inset 3px 0 0 0 var(--accent);
        }
        
        /* Hint icon on hover */
        .click-hint {
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
            margin-left: 8px;
            font-size: 0.8rem;
        }
        tbody tr:hover .click-hint {
            opacity: 1;
        }

        .code-col {
            font-family: monospace;
            color: var(--secondary);
            font-weight: 600;
        }

        .center-text { text-align: center; }
        .teori-val { color: var(--teori-color); font-weight: 600; }
        .praktik-val { color: var(--praktik-color); font-weight: 600; }
        .total-val { color: var(--primary); font-weight: 700; }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 12px;
            border: 2px dashed var(--border);
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 90%;
            max-width: 700px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ef4444;
        }

        .modal-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-right: 2rem; /* Space for close btn */
        }

        .modal-code {
            font-family: monospace;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: block;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.4;
        }

        .modal-body p {
            color: var(--text);
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Detail Section Styles */
        .modal-detail-section {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .modal-detail-section h4 {
            font-size: 0.85rem;
            color: var(--primary);
            margin-bottom: 0.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.25rem;
            display: inline-block;
        }

        .modal-detail-section p {
            font-size: 0.9rem;
            margin-bottom: 0;
            color: var(--secondary);
        }

            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .keyword-pill {
            background-color: #e2e8f0;
            color: #334155;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;

            background-color: #dbeafe; /* Warna biru muda untuk mata kuliah */
            color: #1e40af; /* Biru tua */
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;

            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .modal-footer {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .sks-detail {
            display: flex;
            flex-direction: column;
        }

        .sks-detail .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

            font-size: 1.25rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .nav-tabs { justify-content: flex-start; }
            th, td { padding: 0.75rem; font-size: 0.85rem; }
            .table-container { overflow-x: auto; }
            .modal-content { padding: 1.5rem; }
            .modal-footer { gap: 1rem; justify-content: space-between; }
        }
    </style>
</head>

                            firstPrinciple: "Setiap rekayasa teknik memerlukan dokumentasi resmi sebagai bukti legalitas karya (skripsi) yang bebas plagiarisme dan mematuhi aturan pedoman kampus.",
                            hubungan: ["Bahasa Indonesia", "Proyek 5: Tugas Akhir Mahasiswa"],
                            kompetensi: "Mampu menyusun naskah Skripsi/Tugas Akhir secara sistematis, menggunakan tools sitasi (Mendeley), dan memformulasikan bab analisis hasil.",
                            keywords: ["Penulisan Skripsi", "Citation Management", "Technical Report", "Anti-Plagiarism"]
                        }
                    },
                    { 
                        no: 4, code: "25TI4109", name: "Proyek 5: Tugas Akhir Mahasiswa", t: 0, p: 4, total: 4,
                        details: {
                            firstPrinciple: "Tugas Akhir (Capstone Project) adalah puncak sintesis dari kemampuan logika, manajerial proyek, dan kemampuan komunikasi dalam menciptakan karya komputasi mandiri.",
                            hubungan: ["Semua Mata Kuliah (Capstone)"],
                            kompetensi: "Mampu mengidentifikasi masalah nyata, merancang arsitektur sistem sebagai solusi, mengimplementasikan, menguji, dan mempresentasikan hasil secara komprehensif (Sidang TA).",
                            keywords: ["Capstone Project", "System Implementation", "Final Defense", "Independent Research"]
                        }
                    },
                    { 
                        no: 5, code: "25TI4110", name: "Uji Kompetensi", t: 1, p: 0, total: 1,
                        details: {
                            firstPrinciple: "Validasi keahlian profesi tidak hanya diberikan oleh kampus, melainkan disertifikasi oleh standar industri/lembaga independen (BNSP/Sertifikasi Vendor).",
                            hubungan: ["Praktik Kerja Lapangan (PKL)", "Semua Mata Kuliah Keahlian"],
                            kompetensi: "Mampu mengikuti dan lulus evaluasi standar sertifikasi kompetensi (misalnya Programmer, Database Administrator, atau Network Engineer).",
                            keywords: ["Certification", "BNSP", "Professional Competency", "Skill Validation"]
                        }
                    }
                ]
            }
        ];

        const tabContainer = document.getElementById('tab-buttons');
        const contentContainer = document.getElementById('content-area');

        // Function: Render UI
        function initApp() {
            // Render Buttons
            data.forEach((sem, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = `Semester ${sem.semester}`;
                btn.onclick = () => switchTab(index, sem.semester);
                tabContainer.appendChild(btn);

                // Render Content Blocks
                const contentDiv = document.createElement('div');
                contentDiv.id = `sem-${sem.semester}`;
                contentDiv.className = `semester-content ${index === 0 ? 'active' : ''}`;
                contentDiv.innerHTML = generateContentHTML(sem, index);
                contentContainer.appendChild(contentDiv);
            });
        }

        // Function: Switch Tab Logic
        function switchTab(index, semester) {
            // Update Buttons
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            buttons[index].classList.add('active');

            // Update Content
            const contents = document.querySelectorAll('.semester-content');
            contents.forEach(c => c.classList.remove('active'));
            
            const activeContent = document.getElementById(`sem-${semester}`);
            if(activeContent) activeContent.classList.add('active');
        }

        // Function: Generate Table HTML with Interaction (onclick)
        function generateContentHTML(sem, semIndex) {
            const totalSKS = sem.courses.reduce((acc, curr) => acc + curr.total, 0);

            let html = `
                <div class="info-header">
                    <h2>Semester ${sem.semester}</h2>
                    ${sem.courses.length > 0 ? `<div class="sks-badge">Total: ${totalSKS} SKS</div>` : ''}
                </div>
            `;

            if (sem.courses.length === 0) {
                html += `
                    <div class="empty-state">
                        <h3>Data Tidak Tersedia</h3>
                        <p>${sem.note}</p>
                    </div>
                `;
            } else {
                html += `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 50px;" class="center-text">No</th>
                                    <th>Kode</th>
                                    <th>Mata Kuliah</th>
                                    <th class="center-text" style="width: 80px;">Teori</th>
                                    <th class="center-text" style="width: 80px;">Praktik</th>
                                    <th class="center-text" style="width: 80px;">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                sem.courses.forEach((mk, courseIndex) => {
                    // Added onclick event to trigger the modal
                    html += `
                        <tr onclick="openModal(${semIndex}, ${courseIndex})" title="Klik untuk melihat detail mata kuliah">
                            <td class="center-text">${mk.no}</td>
                            <td class="code-col">${mk.code}</td>
                            <td>
                                ${mk.name}
                                <span class="click-hint">(Lihat Detail)</span>
                            </td>
                            <td class="center-text teori-val">${mk.t > 0 ? mk.t : '-'}</td>
                            <td class="center-text praktik-val">${mk.p > 0 ? mk.p : '-'}</td>
                            <td class="center-text total-val">${mk.total}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }
            return html;
        }

        // Function to open Modal and inject specific course data
        function openModal(semIndex, courseIndex) {
            const course = data[semIndex].courses[courseIndex];
            
            // Populate Modal Fields
            document.getElementById('modal-code').innerText = course.code;
            document.getElementById('modal-title').innerText = course.name;
            
            const modalDesc = document.getElementById('modal-desc');
            if (course.details) {
                modalDesc.innerHTML = `
                    <div class="modal-detail-section">
                        <h4>1. First Principle</h4>
                        <p>${course.details.firstPrinciple}</p>
                    </div>
                    <div class="modal-detail-section">
                        <h4>2. Hubungan Mata Kuliah</h4>
                        <div class="keyword-container">
                            ${Array.isArray(course.details.hubungan) 
                                ? course.details.hubungan.map(mk => `<span class="course-pill">${mk}</span>`).join('')
                                : `<p>${course.details.hubungan}</p>`}
                        </div>
                    </div>
                    <div class="modal-detail-section">
                        <h4>3. Kompetensi Diharapkan</h4>
                        <p>${course.details.kompetensi}</p>
                    </div>
                    <div class="modal-detail-section">
                        <h4>4. Keywords & Terms</h4>
                        <div class="keyword-container">
                            ${course.details.keywords.map(kw => `<span class="keyword-pill">${kw}</span>`).join('')}
                        </div>
                    </div>
                `;
            } else {
                const descText = course.desc ? course.desc : "Deskripsi mendetail untuk mata kuliah ini sedang dalam proses penyusunan/update.";
                modalDesc.innerHTML = `<p>${descText}</p>`;
            }
            
            document.getElementById('modal-t').innerText = course.t;
            document.getElementById('modal-p').innerText = course.p;
            document.getElementById('modal-total').innerText = course.total;

            // Show Modal
            document.getElementById('courseModal').classList.add('active');
        }

        // Function to close Modal
        function closeModal() {
            document.getElementById('courseModal').classList.remove('active');
        }

        // Helper function to determine relationship color (Green if previous semester)
        function getCourseRelationType(relatedCourseName, currentSemester) {
            const normalizedSearch = relatedCourseName.toLowerCase().trim();
            let foundSemester = null;

            for (const sem of data) {
                for (const c of sem.courses) {
                    const courseNameNormalized = c.name.toLowerCase().trim();
                    // Cocokkan sebagian nama jika ada variasi string seperti "(Lanjutan)"
                    if (normalizedSearch.includes(courseNameNormalized) || courseNameNormalized.includes(normalizedSearch)) {
                        foundSemester = sem.semester;
                        break;
                    }
                }
                if (foundSemester) break;
            }

            if (foundSemester && foundSemester < currentSemester) {
                return 'previous';
            }
            return 'other';
        }

        // Function to open Modal and inject specific course data
        function openModal(semIndex, courseIndex) {
            const course = data[semIndex].courses[courseIndex];
            const currentSemester = data[semIndex].semester;
            
            // Populate Modal Fields
            document.getElementById('modal-code').innerText = course.code;
            document.getElementById('modal-title').innerText = course.name;
            
            const modalDesc = document.getElementById('modal-desc');
            if (course.details) {
                modalDesc.innerHTML = `
                    <div class="modal-detail-section">
                        <h4>1. First Principle</h4>
                        <p>${course.details.firstPrinciple}</p>
                    </div>
                    <div class="modal-detail-section">
                        <h4>2. Hubungan Mata Kuliah</h4>
                        <div class="keyword-container">
                            ${Array.isArray(course.details.hubungan) 
                                ? course.details.hubungan.map(mk => {
                                    const relType = getCourseRelationType(mk, currentSemester);
                                    const pillClass = relType === 'previous' ? 'course-pill-green' : 'course-pill-blue';
                                    return `<span class="${pillClass}">${mk}</span>`;
                                }).join('')
                                : `<p>${course.details.hubungan}</p>`}
                        </div>
                    </div>
                    <div class="modal-detail-section">
                        <h4>3. Kompetensi Diharapkan</h4>
                        <p>${course.details.kompetensi}</p>
                    </div>
                    <div class="modal-detail-section">
                        <h4>4. Keywords & Terms</h4>
                        <div class="keyword-container">
                            ${course.details.keywords.map(kw => `<span class="keyword-pill">${kw}</span>`).join('')}
                        </div>
                    </div>
                `;
            } else {
                const descText = course.desc ? course.desc : "Deskripsi mendetail untuk mata kuliah ini sedang dalam proses penyusunan/update.";
                modalDesc.innerHTML = `<p>${descText}</p>`;
            }
            
            document.getElementById('modal-t').innerText = course.t;
            document.getElementById('modal-p').innerText = course.p;
            document.getElementById('modal-total').innerText = course.total;

            // Show Modal
            document.getElementById('courseModal').classList.add('active');
        }

        // Close modal when clicking on the overlay background
        function handleOutsideClick(event) {
            if (event.target.id === 'courseModal') {
                closeModal();
            }
        }
        
        // Listen for ESC key to close modal
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });

        // Run Application
        initApp();

    </script>
</body>
</html>
